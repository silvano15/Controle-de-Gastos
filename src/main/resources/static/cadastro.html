<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>Criar conta - Meus Gastos</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-main">
    <form id="form-cadastro" class="auth-card" autocomplete="on">
      <h1>Criar conta</h1>
      <p class="auth-sub">Leva menos de um minuto</p>

      <input id="nome" class="desc-input" type="text" placeholder="Seu nome" autocomplete="name" required>
      <input id="email" class="desc-input" type="email" placeholder="E-mail" autocomplete="username" required>
      <input id="senha" class="desc-input" type="password" placeholder="Senha (mín. 8 caracteres)" autocomplete="new-password" minlength="8" required>
      <input id="confirmar" class="desc-input" type="password" placeholder="Confirme a senha" autocomplete="new-password" minlength="8" required>

      <button id="criar" class="btn-principal" type="submit">Criar conta</button>

      <div class="auth-links">
        <a href="/login.html">Já tenho conta</a>
      </div>
    </form>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) window.location.href = "/";

    document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;
      if (senha !== confirmar) { toast("As senhas não são iguais", true); return; }

      const btn = document.getElementById("criar");
      btn.disabled = true;
      btn.textContent = "Criando...";
      try {
        const dados = await api("/api/auth/cadastro", {
          method: "POST",
          body: JSON.stringify({
            nome: document.getElementById("nome").value.trim(),
            email: document.getElementById("email").value.trim(),
            senha,
          }),
        });
        setToken(dados.token);
        window.location.href = "/";
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Criar conta";
      }
    });
  </script>
</body>
</html>
