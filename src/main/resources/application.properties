spring.application.name=controle-gastos
server.port=${PORT:8080}

# ===== MySQL / TiDB Cloud (compatível com MySQL) =====
# Em produção (TiDB Serverless) usa porta 4000 e TLS obrigatório (sslMode=VERIFY_IDENTITY).
# No seu computador, com MySQL local, use DB_PORT=3306 e DB_SSL_MODE=PREFERRED (veja o README).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:gastos}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&enabledTLSProtocols=TLSv1.2,TLSv1.3&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Plano gratuito: poucas conexões bastam
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000

# Cria/atualiza a tabela automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== App =====
# Fuso usado para registrar a data/hora do gasto
app.timezone=${APP_TIMEZONE:America/Recife}
# PIN de acesso (deixe vazio para desativar). Protege seus dados, já que a URL é pública.
app.pin=${APP_PIN:}
