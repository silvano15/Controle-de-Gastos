<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>Esqueci minha senha - Meus Gastos</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-main">
    <form id="form-esqueci" class="auth-card" autocomplete="on">
      <h1>Esqueci minha senha</h1>
      <p class="auth-sub">Enviamos um link de redefinição para o seu e-mail</p>

      <input id="email" class="desc-input" type="email" placeholder="E-mail" autocomplete="username" required>

      <button id="enviar" class="btn-principal" type="submit">Enviar link</button>

      <div class="auth-links">
        <a href="/login.html">Voltar para o login</a>
      </div>
    </form>

    <div id="sucesso" class="auth-card" style="display:none">
      <h1>Confira seu e-mail</h1>
      <p class="auth-sub">Se esse e-mail tiver uma conta, você vai receber um link para redefinir a senha em alguns instantes. O link vale por 1 hora.</p>
      <a class="btn-principal" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="/login.html">Voltar para o login</a>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("form-esqueci").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("enviar");
      btn.disabled = true;
      btn.textContent = "Enviando...";
      try {
        await api("/api/auth/esqueci-senha", {
          method: "POST",
          body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
        });
        document.getElementById("form-esqueci").style.display = "none";
        document.getElementById("sucesso").style.display = "block";
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
        btn.textContent = "Enviar link";
      }
    });
  </script>
</body>
</html>
